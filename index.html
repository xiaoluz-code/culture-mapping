<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cultural Communication Mapping</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  :root{
    /* ---- BRAND TOKENS — replace with official Coupang values ---- */
    --brand:#0B5FCE;          /* Coupang blue — primary accent (approximate) */
    --brand-dark:#0A4C9E;     /* darker blue for small bold text on white (approximate) */
    --ink:#111823;            /* body text */
    --slate:#4A5563;          /* secondary text */
    --light:#F5F6F8;          /* panel fill */
    --line:#D3D8DF;           /* borders */
    --white:#FFFFFF;
    /* ------------------------------------------------------------- */
    /* country markers — light, so "You" stays dominant */
    --c-us:#7FB3E8;           /* light blue */
    --c-kr:#7ACBB4;           /* light teal-green */
    --c-jp:#E3A76F;           /* light amber */
    --terra:var(--brand); --tint:#FFFFFF;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--white);color:var(--ink);
    font-family:"CP Sans","CPSans","Coupang Sans","Pretendard Variable",Pretendard,"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Hiragino Sans","Yu Gothic",Arial,sans-serif;
    letter-spacing:-0.01em;
    -webkit-font-smoothing:antialiased; line-height:1.45}
  button{font:inherit;color:inherit}
  .wrap{max-width:560px;margin:0 auto;padding:20px 20px 48px;min-height:100dvh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
  .brand{font-size:13px;color:var(--slate)}
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .lang button{background:none;border:0;padding:6px 12px;font-size:13px;color:var(--slate);cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--brand);color:#fff}
  .lang button:focus-visible{outline:2px solid var(--terra);outline-offset:-2px}
  .progress{height:3px;background:var(--light);border-radius:2px;margin:10px 0 28px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--brand);width:0;transition:width .35s ease}
  h1{font-size:30px;line-height:1.15;margin:12px 0 14px;letter-spacing:-.025em;font-weight:700}
  .lead{font-size:17px;color:var(--slate);margin:0 0 26px;max-width:36em}
  .btn{display:inline-flex;align-items:center;justify-content:center;background:var(--brand);color:#fff;border:0;border-radius:10px;padding:15px 22px;font-size:17px;font-weight:600;cursor:pointer;min-height:52px}
  .btn.secondary{background:var(--light);color:var(--ink)}
  .btn:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
  .btn[disabled]{opacity:.45;cursor:default}
  .count{font-size:13px;color:var(--slate);margin-bottom:8px}
  .q{font-size:20px;line-height:1.4;font-weight:700;letter-spacing:-.015em;color:var(--ink);margin:0 0 20px;padding:2px 0 0 16px;border-left:4px solid var(--terra)}
  .opts{display:grid;gap:10px}
  .opt{text-align:left;background:var(--white);border:2px solid var(--line);border-radius:12px;padding:14px 16px;font-size:16px;line-height:1.4;cursor:pointer}
  .opt:hover{border-color:var(--slate)}
  .opt[aria-pressed="true"]{border-color:var(--terra);background:#fff;box-shadow:inset 0 0 0 1px var(--terra)}
  .opt:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px}
  .foot{margin-top:auto;padding-top:28px;font-size:13px;color:var(--slate)}
  /* results */
  .scale{padding:22px 0 10px;border-top:1px solid var(--line)}
  .scale:first-of-type{border-top:0;padding-top:8px}
  .scale h2{font-size:18px;margin:0 0 4px;letter-spacing:-.015em;font-weight:700}
  .scale .sub{font-size:14px;color:var(--slate);margin:0 0 18px}
  .track{position:relative;height:84px;margin:0 6px}
  .track .rail{position:absolute;left:0;right:0;top:44px;height:3px;background:var(--line);border-radius:2px}
  .track .end{position:absolute;top:0;font-size:12px;color:var(--slate);white-space:nowrap}
  .track .end.l{left:0} .track .end.r{right:0;text-align:right}
  .dot{position:absolute;top:37px;width:16px;height:16px;border-radius:50%;background:var(--slate);border:2px solid #fff;transform:translateX(-50%);box-shadow:0 0 0 1px rgba(0,0,0,.10)}
  .dot .lbl{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:600;color:var(--slate);white-space:nowrap}
  .dot.me{width:24px;height:24px;top:33px;background:var(--brand);z-index:2;box-shadow:0 2px 8px rgba(11,95,206,.30)}
  .dot.me .lbl{top:-22px;color:var(--brand-dark);font-weight:700}
  .dot.me.animate{left:50%;transition:left .9s cubic-bezier(.2,.7,.2,1)}
  .read{font-size:15px;color:var(--ink);margin:22px 0 0;padding:14px 16px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--terra);border-radius:0 10px 10px 0}
  .read strong{color:var(--brand-dark)}
  .habits{margin-top:30px;padding:18px;background:var(--light);border:1px solid var(--line);border-radius:12px}
  .habits h3{margin:0 0 10px;font-size:16px}
  .habits ol{margin:0;padding-left:20px;font-size:15px} .habits li{margin:6px 0}
  .note{font-size:13px;color:var(--slate);margin-top:20px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
  .actions .btn{flex:1 1 auto;min-width:140px}
  .saved{font-size:13px;color:var(--slate);margin-top:10px;min-height:18px}
  @media (prefers-reduced-motion: reduce){ .dot.me.animate{transition:none} .progress i{transition:none} }
</style>
</head>

      { s:"set", q:"来月からチームの目標が変わります。どう伝えますか？", o:[

      { s:"set", q:"直属のメンバーが難しい仕事を非常にうまくやり遂げました。あなたは：", o:[

// Culture marker positions per scale, 0–100 (approximate, after Meyer)
const CULT = {
  comm: { us: 8,  kr: 74, jp: 94 },
  eval: { us: 30, kr: 72, jp: 92 },
  set:  { us: 12, kr: 60, jp: 88 }
};

// ---------------------------------------------------------------- state
let lang = (navigator.language||"en").startsWith("ko") ? "ko" : (navigator.language||"en").startsWith("ja") ? "ja" : "en";
let step = -1;            // -1 intro, 0..11 questions, 12 results
let answers = new Array(9).fill(null);
const app = document.getElementById("app");

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function header(){
  return `<header>
    <div class="brand">${esc(T[lang].brand)}</div>
    <div class="lang" role="group" aria-label="Language">
      <button aria-pressed="${lang==='en'}" data-lang="en">EN</button>
      <button aria-pressed="${lang==='ko'}" data-lang="ko">한국어</button>
      <button aria-pressed="${lang==='ja'}" data-lang="ja">日本語</button>
    </div></header>`;
}

function render(){
  const t = T[lang];
  let html = header();
  if (step === -1){
    html += `<h1>${esc(t.title)}</h1><p class="lead">${esc(t.lead)}</p>
      <div><button class="btn" id="start">${esc(t.start)}</button></div>
      <p class="foot">${esc(t.approx)}</p>`;
  } else if (step < 9){
    const q = t.questions[step];
    const pct = Math.round((step/9)*100);
    html += `<div class="progress"><i style="width:${pct}%"></i></div>
      <div class="count">${esc(t.count(step+1,9))}</div>
      <p class="q">${esc(q.q)}</p>
      <div class="opts" role="radiogroup">
        ${q.o.map((o,i)=>`<button class="opt" role="radio" aria-pressed="${answers[step]===i}" aria-checked="${answers[step]===i}" data-i="${i}">${esc(o)}</button>`).join("")}
      </div>
      <div class="nav">
        <button class="btn secondary" id="back">${esc(t.back)}</button>
        <button class="btn" id="next" ${answers[step]===null?"disabled":""}>${esc(step===8?t.finish:t.next)}</button>
      </div>`;
  } else {
    html += results();
  }
  app.innerHTML = html;
  bind();
  if (step===9) requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll(".dot.me").forEach(d=>{ d.style.left = d.dataset.left + "%"; });
  }));
  window.scrollTo({top:0});
}

function scores(){
  const t = T[lang];
  const sum = {comm:0,eval:0,set:0};
  t.questions.forEach((q,i)=>{ sum[q.s] += (answers[i] ?? 0) + 1; });
  const pos = {};
  for (const k in sum) pos[k] = Math.round(((sum[k]-3)/9)*100); // 3..12 → 0..100
  return pos;
}

function results(){
  const t = T[lang];
  const pos = scores();
  const names = { jp:t.jp, kr:t.kr, us:t.us };
  let html = `<h1>${esc(t.resultsTitle)}</h1><p class="lead">${esc(t.resultsLead)}</p>`;
  t.scales.forEach(sc=>{
    const me = pos[sc.key], c = CULT[sc.key];
    const dist = Object.entries(c).map(([k,v])=>[k,Math.abs(v-me)]).sort((a,b)=>a[1]-b[1]);
    const closest = names[dist[0][0]];
    const reading = me < 50 ? sc.low : sc.high;
    html += `<section class="scale">
      <h2>${esc(sc.name)}</h2><p class="sub">${esc(sc.sub)}</p>
      <div class="track">
        <span class="end l">${esc(sc.l)}</span><span class="end r">${esc(sc.r)}</span>
        <div class="rail"></div>
        <div class="dot" style="left:${c.us}%;background:var(--c-us)"><span class="lbl">${esc(t.us)}</span></div>
        <div class="dot" style="left:${c.kr}%;background:var(--c-kr)"><span class="lbl">${esc(t.kr)}</span></div>
        <div class="dot" style="left:${c.jp}%;background:var(--c-jp)"><span class="lbl">${esc(t.jp)}</span></div>
        <div class="dot me animate" data-left="${me}"><span class="lbl">${esc(t.you)}</span></div>
      </div>
      <p class="read">${t.closest(esc(closest))} ${esc(reading)}</p>
    </section>`;
  });
  html += `<p class="note">${esc(t.approx)}</p>
    <div class="actions">
      <button class="btn" id="save">${esc(t.save)}</button>
      <button class="btn secondary" id="share" hidden>${esc(t.share)}</button>
    </div>
    <p class="saved" id="saved" role="status"></p>
    <div style="margin-top:14px"><button class="btn secondary" id="again">${esc(t.again)}</button></div>`;
  return html;
}


// ---------------------------------------------------------------- result card
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

function drawCard(){
  const t = T[lang], pos = scores();
  const W = 1080, H = 1090, P = 80;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const g = cv.getContext("2d");
  const fam = getComputedStyle(document.body).fontFamily;

  const BRAND = cssVar("--brand") || "#0B5FCE";
  const DARK  = cssVar("--brand-dark") || "#0A4C9E";
  const INK   = cssVar("--ink") || "#111823";
  const SLATE = cssVar("--slate") || "#4A5563";
  const LINE  = cssVar("--line") || "#D3D8DF";
  const CC = { us: cssVar("--c-us")||"#7FB3E8", kr: cssVar("--c-kr")||"#7ACBB4", jp: cssVar("--c-jp")||"#E3A76F" };
  const names = { jp:t.jp, kr:t.kr, us:t.us };

  g.fillStyle = "#fff"; g.fillRect(0,0,W,H);

  // header
  g.fillStyle = BRAND; g.fillRect(0,0,W,14);
  g.fillStyle = INK;
  g.font = `700 46px ${fam}`;
  g.textBaseline = "alphabetic";
  g.fillText(t.cardFoot, P, 128);

  let y = 210;
  t.scales.forEach(sc=>{
    const me = pos[sc.key], c = CULT[sc.key];
    const dist = Object.entries(c).map(([k,v])=>[k,Math.abs(v-me)]).sort((a,b)=>a[1]-b[1]);
    const closest = names[dist[0][0]];

    g.fillStyle = INK; g.font = `700 34px ${fam}`;
    g.fillText(sc.name, P, y);

    // rail
    const x0 = P + 40, x1 = W - P - 40, len = x1 - x0, ry = y + 96;
    g.strokeStyle = LINE; g.lineWidth = 5; g.lineCap = "round";
    g.beginPath(); g.moveTo(x0, ry); g.lineTo(x1, ry); g.stroke();

    // end labels
    g.fillStyle = SLATE; g.font = `400 22px ${fam}`;
    g.textAlign = "left";  g.fillText(sc.l, P, y + 52);
    g.textAlign = "right"; g.fillText(sc.r, W - P, y + 52);
    g.textAlign = "center";

    // country dots
    [["us",CC.us],["kr",CC.kr],["jp",CC.jp]].forEach(([k,col])=>{
      const cx = x0 + len * (c[k]/100);
      g.beginPath(); g.arc(cx, ry, 15, 0, Math.PI*2);
      g.fillStyle = col; g.fill();
      g.lineWidth = 4; g.strokeStyle = "#fff"; g.stroke();
      g.fillStyle = SLATE; g.font = `600 21px ${fam}`;
      g.fillText(names[k], cx, ry + 46);
    });

    // you
    const mx = x0 + len * (me/100);
    g.beginPath(); g.arc(mx, ry, 24, 0, Math.PI*2);
    g.fillStyle = BRAND; g.fill();
    g.lineWidth = 6; g.strokeStyle = "#fff"; g.stroke();
    g.fillStyle = DARK; g.font = `700 23px ${fam}`;
    g.fillText(t.you, mx, ry - 40);

    g.textAlign = "left";
    g.fillStyle = DARK; g.font = `600 25px ${fam}`;
    g.fillText(t.closestPlain(closest), P, ry + 108);

    y += 310;
  });

  return cv;
}

function cardFile(cb){
  drawCard().toBlob(b=>{
    if(!b) return cb(null);
    cb(new File([b], "culture-mapping.png", { type:"image/png" }));
  }, "image/png");
}

function bind(){
  document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{ lang=b.dataset.lang; render(); }));
  const s=document.getElementById("start"); if(s) s.addEventListener("click",()=>{ step=0; render(); });
  document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    answers[step]=+b.dataset.i; render();
    document.getElementById("next")?.focus();
  }));
  const n=document.getElementById("next"); if(n) n.addEventListener("click",()=>{ if(answers[step]!==null){ step++; render(); } });
  const bk=document.getElementById("back"); if(bk) bk.addEventListener("click",()=>{ step = step===0 ? -1 : step-1; render(); });
  const a=document.getElementById("again"); if(a) a.addEventListener("click",()=>{ answers=new Array(9).fill(null); step=-1; render(); });

  const sv=document.getElementById("save");
  if(sv) sv.addEventListener("click",()=>{
    try{
      const url = drawCard().toDataURL("image/png");
      const link = document.createElement("a");
      link.href = url; link.download = "culture-mapping.png";
      document.body.appendChild(link); link.click(); link.remove();
      const n=document.getElementById("saved"); if(n) n.textContent = "\u2713";
    }catch(e){ const n=document.getElementById("saved"); if(n) n.textContent = "—"; }
  });

  const sh=document.getElementById("share");
  if(sh){
    let probe;
    try{ probe = new File([new Blob(["x"])], "a.png", {type:"image/png"}); }catch(e){ probe = null; }
    if(probe && navigator.canShare && navigator.canShare({files:[probe]})){
      sh.hidden = false;
      sh.addEventListener("click",()=>{
        cardFile(f=>{
          if(!f) return;
          navigator.share({ files:[f], title: T[lang].cardFoot }).catch(()=>{});
        });
      });
    }
  }
}

render();
</script>

</html>
